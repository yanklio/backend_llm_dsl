[project]
name = "nestjs-dsl-generator"
version = "0.1.0"
description = "AI-powered NestJS application generator using DSL"
requires-python = ">=3.9"

[project.scripts]
nestforge = "apps.cli.main:main"
nestgen = "apps.cli.main:main"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D104", "D107", "D301", "B904", "D101", "D103", "D105", "D107", "D200", "D415", "F811"]

[tool.ruff.lint.per-file-ignores]
"packages/llm_providers/core/prompts.py" = ["E501"]
"apps/experiments/*.py" = ["E501"]
"tests/**" = ["E501", "F811", "D102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/unit"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=packages",
    "--cov=apps",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
    "-v",
    "--tb=short"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take a long time to run"
]
