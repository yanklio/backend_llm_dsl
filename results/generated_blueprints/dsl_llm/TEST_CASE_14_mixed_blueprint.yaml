root:
  name: LibraryManagement
  database:
    type: sqlite
    database: ./data/library.db
    synchronize: true
    logging: false
  features:
    cors: true
    swagger: true
modules:
  - name: Author
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: name
          type: string
          required: true
          validation: {minLength: 2, maxLength: 100}
        - name: biography
          type: string
          required: false
          validation: {maxLength: 1000}
      relations:
        - type: ManyToMany
          model: Book
          field: books
          description: Books written by this author
  - name: Book
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: title
          type: string
          required: true
          validation: {minLength: 1, maxLength: 200}
        - name: isbn
          type: string
          required: true
          unique: true
          validation: {maxLength: 20}
        - name: publishedYear
          type: number
          required: true
          validation: {min: 1000, max: 2030}
        - name: available
          type: boolean
          required: true
          default: true
      relations:
        - type: ManyToMany
          model: Author
          field: authors
          description: Authors of this book
        - type: OneToMany
          model: Loan
          field: loans
          description: Loans for this book
  - name: Loan
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: borrowerName
          type: string
          required: true
          validation: {maxLength: 100}
        - name: borrowDate
          type: date
          required: true
        - name: returnDate
          type: date
          required: false
        - name: status
          type: enum
          required: true
          enum: [active, returned, overdue]
          default: active
      relations:
        - type: ManyToOne
          model: Book
          field: book
          description: The book being loaned