root:
  name: SchoolManagement
  database:
    type: sqlite
    database: ./data/app.db
    synchronize: true
    logging: false
  features:
    cors: true
    swagger: true
modules:
- name: Teacher
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: firstName
      type: string
      required: true
      validation:
        minLength: 2
        maxLength: 50
    - name: lastName
      type: string
      required: true
      validation:
        minLength: 2
        maxLength: 50
    - name: email
      type: string
      required: true
      unique: true
      validation:
        isEmail: true
    - name: subject
      type: string
      required: true
      validation:
        maxLength: 100
    relations:
    - type: OneToMany
      model: Course
      field: courses
      required: true
      inverseField: teacher
- name: Course
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: name
      type: string
      required: true
      validation:
        minLength: 3
        maxLength: 150
    - name: description
      type: string
      required: true
      validation:
        maxLength: 500
    - name: credits
      type: number
      required: true
      validation:
        min: 1
        max: 10
    relations:
    - type: ManyToOne
      model: Teacher
      field: teacher
      required: true
      inverseField: courses
