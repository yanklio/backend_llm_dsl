root:
  name: UserAdministration
  database:
    type: sqlite
    database: ./data/app.db
    synchronize: true
    logging: false
  features:
    cors: true
    swagger: true
modules:
  - name: User
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: email
          type: string
          required: true
          validation: {email: true}
        - name: name
          type: string
          required: true
          validation: {minLength: 1, maxLength: 100}