root:
  name: CustomerOrderManagement
  database:
    type: sqlite
    database: ./data/app.db
    synchronize: true
    logging: false

  features:
    cors: true
    swagger: true

modules:
  - name: Customer
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: name
          type: string
          required: true
          validation: {minLength: 2, maxLength: 100}
        - name: email
          type: string
          required: true
          validation: {unique: true, format: email}
        - name: phone
          type: string
          required: false
          validation: {maxLength: 20}
      relations:
        - type: OneToMany
          model: Order
          field: orders
          description: Orders placed by this customer
  - name: Order
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: totalPrice
          type: number
          required: true
          validation: {min: 0}
        - name: status
          type: enum
          required: true
          enum: [pending, confirmed, shipped, delivered, cancelled]
          default: pending
        - name: orderDate
          type: date
          required: true
      relations:
        - type: ManyToOne
          model: Customer
          field: customer
          description: The customer who placed the order
          cascade: delete