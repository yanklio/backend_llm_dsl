root:
  name: MedicalClinic
  database:
    type: sqlite
    database: ./data/clinic.db
    synchronize: true
    logging: false

  features:
    cors: true
    swagger: true

modules:
  - name: Doctor
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: firstName
          type: string
          required: true
          validation: {minLength: 2, maxLength: 50}
        - name: lastName
          type: string
          required: true
          validation: {minLength: 2, maxLength: 50}
        - name: specialization
          type: string
          required: true
          validation: {maxLength: 100}
        - name: email
          type: string
          required: true
          validation: {unique: true, format: email}
      relations:
        - type: OneToMany
          model: Appointment
          field: appointments
          description: Appointments scheduled with this doctor
  - name: Patient
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: firstName
          type: string
          required: true
          validation: {minLength: 2, maxLength: 50}
        - name: lastName
          type: string
          required: true
          validation: {minLength: 2, maxLength: 50}
        - name: dateOfBirth
          type: date
          required: true
        - name: phone
          type: string
          required: false
          validation: {maxLength: 20}
      relations:
        - type: OneToMany
          model: Appointment
          field: appointments
          description: Appointments associated with this patient
  - name: Appointment
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: appointmentDate
          type: date
          required: true
        - name: reason
          type: string
          required: true
          validation: {maxLength: 300}
        - name: status
          type: enum
          required: true
          enum: [scheduled, in_progress, completed, cancelled]
          default: scheduled
        - name: notes
          type: string
          required: false
          validation: {maxLength: 1000}
      relations:
        - type: ManyToOne
          model: Doctor
          field: doctor
          description: Doctor for the appointment
        - type: ManyToOne
          model: Patient
          field: patient
          description: Patient for the appointment
    dto:
      filters:
        - name: status
          type: enum
          enum: [scheduled, in_progress, completed, cancelled]
        - name: appointmentDate
          type: date
        - name: limit
          type: number
          default: 10
        - name: page
          type: number
          default: 1