root:
  name: WarehouseInventory
  database:
    type: sqlite
    database: ./data/app.db
    synchronize: true
    logging: false
  features:
    cors: true
    swagger: true
modules:
- name: Section
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: name
      type: string
      required: true
      unique: true
      validation:
        minLength: 1
        maxLength: 50
    - name: floor
      type: number
      required: true
      validation:
        min: 1
        max: 20
    relations:
    - type: OneToMany
      model: Item
      field: items
      required: true
      inverseField: section
- name: Item
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: sku
      type: string
      required: true
      unique: true
      validation:
        maxLength: 30
    - name: name
      type: string
      required: true
      validation:
        minLength: 2
        maxLength: 100
    - name: quantity
      type: number
      required: true
      validation:
        min: 0
    - name: weight
      type: number
      required: true
      validation:
        min: 0
    relations:
    - type: ManyToOne
      model: Section
      field: section
      required: true
      inverseField: items
