root:
  name: LibraryManagement
  database:
    type: sqlite
    database: ./data/app.db
    synchronize: true
    logging: false
  features:
    cors: true
    swagger: true
modules:
- name: Author
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: name
      type: string
      required: true
      validation:
        minLength: 2
        maxLength: 100
    - name: biography
      type: string
      required: true
      validation:
        maxLength: 1000
    relations:
    - type: ManyToMany
      model: Book
      field: books
      required: true
      inverseField: authors
- name: Book
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: title
      type: string
      required: true
      validation:
        minLength: 1
        maxLength: 200
    - name: isbn
      type: string
      required: true
      unique: true
      validation:
        maxLength: 20
    - name: publishedYear
      type: number
      required: true
      validation:
        min: 1000
        max: 2030
    - name: available
      type: boolean
      required: true
      default: 'true'
    relations:
    - type: ManyToMany
      model: Author
      field: authors
      required: true
      inverseField: books
    - type: OneToMany
      model: Loan
      field: loans
      required: true
      inverseField: book
- name: Loan
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: borrowerName
      type: string
      required: true
      validation:
        maxLength: 100
    - name: borrowDate
      type: date
      required: true
    - name: returnDate
      type: date
      required: true
    - name: status
      type: enum
      required: true
      enumValues:
      - ACTIVE
      - RETURNED
      - OVERDUE
      default: ACTIVE
    relations:
    - type: ManyToOne
      model: Book
      field: book
      required: true
      inverseField: loans
