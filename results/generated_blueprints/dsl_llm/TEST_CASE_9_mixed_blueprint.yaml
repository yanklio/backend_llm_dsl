root:
  name: SchoolAdministration
  database:
    type: sqlite
    database: ./data/school.db
    synchronize: true
    logging: false

  features:
    cors: true
    swagger: true

modules:
  - name: Teacher
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: firstName
          type: string
          required: true
          validation: {minLength: 2, maxLength: 50}
        - name: lastName
          type: string
          required: true
          validation: {minLength: 2, maxLength: 50}
        - name: email
          type: string
          required: true
          unique: true
          validation: {format: email}
        - name: subject
          type: string
          required: true
          validation: {maxLength: 100}
      relations:
        - type: OneToMany
          model: Course
          field: courses
          description: A list of courses taught by this teacher
  - name: Course
    generate: [controller, service, module, entity, dto]
    entity:
      fields:
        - name: name
          type: string
          required: true
          validation: {minLength: 3, maxLength: 150}
        - name: description
          type: string
          required: false
          validation: {maxLength: 500}
        - name: credits
          type: number
          required: true
          validation: {min: 1, max: 10}
      relations:
        - type: ManyToOne
          model: Teacher
          field: teacher
          description: The teacher responsible for this course