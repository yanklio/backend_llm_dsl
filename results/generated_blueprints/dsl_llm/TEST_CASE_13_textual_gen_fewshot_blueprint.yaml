root:
  name: MedicalClinic
  database:
    type: sqlite
    database: ./data/clinic.db
    synchronize: true
    logging: false
  features:
    cors: true
    swagger: true
modules:
- name: Doctor
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: firstName
      type: string
      required: true
      validation:
        minLength: 2
        maxLength: 50
    - name: lastName
      type: string
      required: true
      validation:
        minLength: 2
        maxLength: 50
    - name: specialization
      type: string
      required: true
      validation:
        maxLength: 100
    - name: email
      type: string
      required: true
      unique: true
      validation:
        isEmail: true
    relations:
    - type: OneToMany
      model: Appointment
      field: appointments
      required: true
      inverseField: doctor
- name: Patient
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: firstName
      type: string
      required: true
      validation:
        minLength: 2
        maxLength: 50
    - name: lastName
      type: string
      required: true
      validation:
        minLength: 2
        maxLength: 50
    - name: dateOfBirth
      type: date
      required: true
    - name: phone
      type: string
      required: true
      validation:
        maxLength: 20
    relations:
    - type: OneToMany
      model: Appointment
      field: appointments
      required: true
      inverseField: patient
- name: Appointment
  generate:
  - controller
  - service
  - module
  - entity
  - dto
  entity:
    fields:
    - name: appointmentDate
      type: date
      required: true
    - name: reason
      type: string
      required: true
      validation:
        maxLength: 300
    - name: status
      type: enum
      required: true
      enumValues:
      - SCHEDULED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      default: SCHEDULED
    - name: notes
      type: string
      required: true
      validation:
        maxLength: 1000
    relations:
    - type: ManyToOne
      model: Doctor
      field: doctor
      required: true
      inverseField: appointments
      onDelete: CASCADE
    - type: ManyToOne
      model: Patient
      field: patient
      required: true
      inverseField: appointments
      onDelete: CASCADE
